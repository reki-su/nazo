<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>謎解きヒント＆解答</title>
    <style>
        :root {
            --primary-color: #00a497; /* Life is Tech! 風のグリーン */
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #333;
            --accent-color: #e91e63;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            padding: 2.5rem 1.5rem;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            font-size: 1.4rem;
            margin-bottom: 2rem;
            color: var(--text-color);
            letter-spacing: 0.05em;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .toggle-btn {
            background: #eee;
            color: var(--text-color);
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .toggle-btn:hover {
            background: #e0e0e0;
        }

        .toggle-btn.active {
            background: var(--primary-color);
            color: white;
        }

        .toggle-btn.answer {
            background: #444;
            color: white;
            margin-top: 10px;
        }

        .content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            background: #fafafa;
            border-radius: 12px;
        }

        .content p {
            padding: 20px;
            margin: 0;
            font-size: 0.95rem;
            line-height: 1.7;
            text-align: left;
            border: 1px solid #eee;
            border-radius: 12px;
        }

        .is-open {
            max-height: 300px;
            margin-bottom: 5px;
        }

        .highlight {
            color: var(--accent-color);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>謎解きのヒントと解答</h1>
    
    <div class="button-group">
        <button id="btn-hint1" class="toggle-btn" onclick="toggleContent('hint1', 'btn-hint1')">ヒント 1</button>
        <div id="hint1" class="content">
            <p>数字をよく見てみましょう。<br>「3 5」で「フ」、「1 8」で「ル」……。どうやら<span class="highlight">五十音表（あいうえお表）</span>が関係しているようです。</p>
        </div>

        <button id="btn-hint2" class="toggle-btn" onclick="toggleContent('hint2', 'btn-hint2')">ヒント 2</button>
        <div id="hint2" class="content">
            <p>「6 1」の上に「↑」がありますね。これは、6行目（は行）の1番目「は」を、五十音順で<span class="highlight">一つ後ろ</span>にずらすという意味です。<br>「は」の次は……？</p>
        </div>

        <button id="btn-answer" class="toggle-btn answer" onclick="toggleContent('answer', 'btn-answer')">解答を見る</button>
        <div id="answer" class="content">
            <p>正解は…<br><br><span class="highlight" style="font-size: 1.2rem;">「プレゼント」</span>です！<br><br>
            <small>【解説】<br>
            6 8 → ほ<br>
            1 4 → え (+1) → れ<br>
            9 7 → ぜ<br>
            1 8 → ん<br>
            1 1 → あ (-1) → と<br>
            あいうえお表の「行」と「段」に対応していました。</small></p>
        </div>
    </div>
</div>

<script>
    function toggleContent(id, btnId) {
        const content = document.getElementById(id);
        const btn = document.getElementById(btnId);
        const isOpen = content.classList.contains('is-open');
        
        // 全て閉じる
        document.querySelectorAll('.content').forEach(el => el.classList.remove('is-open'));
        document.querySelectorAll('.toggle-btn').forEach(el => el.classList.remove('active'));
        
        // クリックしたものが閉じていれば開く
        if (!isOpen) {
            content.classList.add('is-open');
            btn.classList.add('active');
        }
    }
</script>

</body>
</html>
